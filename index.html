<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Js</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section>
            <div class="infos">
                <div class="info">
                    <h3>High Score:
                        <span class="high-score">0</span>
                    </h3>
                </div>
                <div class="info">
                    <h3>Score:
                        <span class="score">0</span>
                    </h3>
                </div>
                <div class="info">
                    <h3>Time:
                        <span class="time">00-00</span>
                    </h3>
                </div>
            </div>
            <div class="board">
            </div>
        </section>

        <div class="modal">
            <div class="start-game">
                <h3>Welcome to Snake Game</h3>
                <button class="btn btn-start">Start game</button>
                <p class="controls-note">Relive the old Nokia days 🎮</p>
                <div class="controls">
                    <div class="top">
                        <div class="box">
                            <span class="arrow">↑</span> <br>
                            UP
                        </div>
                    </div>
                    <div class="bottom">
                        <div class="box">
                            <span class="arrow">←</span> <br>
                            LEFT
                        </div>
                        <div class="box">
                            <span class="arrow">↓</span> <br>
                            DOWN
                        </div>
                        <div class="box">
                            <span class="arrow"> →</span> <br>
                            RIGHT
                        </div>
                    </div>
                </div>
            </div>
            <div class="game-over">
                <h3>Game Over</h3>
                <button class="btn btn-restart">Restart Game</button>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
